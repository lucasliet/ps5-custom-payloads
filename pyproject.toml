[project]
name = "ps5-custom-payloads"
version = "1.0.0"
description = "Payload Manager catalog for jailbroken PS5s, resolved from GitHub Releases"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
]

[dependency-groups]
icons = [
    "pillow>=11",
]

[tool.fastapi]
entrypoint = "main:app"
